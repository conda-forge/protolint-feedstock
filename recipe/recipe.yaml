schema_version: 1

context:
  version: "0.57.0"

package:
  name: protolint
  version: ${{ version }}

source:
  url: https://github.com/yoheimuta/protolint/archive/v${{ version }}.tar.gz
  sha256: c6bf097168e965dd32554830a4f8a87da6ab0e8902adcf12a3507009e3686e7a

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - protolint --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: A pluggable linter and fixer to enforce Protocol Buffer style and conventions.
  homepage: https://github.com/yoheimuta/protolint
  repository: https://github.com/yoheimuta/protolint

extra:
  recipe-maintainers:
    - danielnachun
