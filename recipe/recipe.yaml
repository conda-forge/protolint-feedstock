schema_version: 1

context:
  version: "0.58.0"

package:
  name: protolint
  version: ${{ version }}

source:
  url: https://github.com/yoheimuta/protolint/archive/v${{ version }}.tar.gz
  sha256: 7d5f4650ed23f68c34a6be1ba77fb3661dd4b7b28b64664a479b6835febceb18

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - protolint --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: A pluggable linter and fixer to enforce Protocol Buffer style and conventions.
  homepage: https://github.com/yoheimuta/protolint
  repository: https://github.com/yoheimuta/protolint

extra:
  recipe-maintainers:
    - danielnachun
