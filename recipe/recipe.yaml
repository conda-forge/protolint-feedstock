schema_version: 1

context:
  version: "0.59.1"

package:
  name: protolint
  version: ${{ version }}

source:
  url: https://github.com/yoheimuta/protolint/archive/v${{ version }}.tar.gz
  sha256: dc8c48dc380f8ee362b7855c5677cc076995bcaf8633bf2b731add0f6052c0ff

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - protolint --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: A pluggable linter and fixer to enforce Protocol Buffer style and conventions.
  homepage: https://github.com/yoheimuta/protolint
  repository: https://github.com/yoheimuta/protolint

extra:
  recipe-maintainers:
    - danielnachun
